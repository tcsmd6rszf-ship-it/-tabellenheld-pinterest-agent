name: TabellenHeld Pinterest Agent

on:
  workflow_dispatch:

jobs:
  pinterest-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Pinterest Boards testen
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["PINTEREST_ACCESS_TOKEN"]

          response = requests.get(
              "https://api.pinterest.com/v5/boards",
              headers={
                  "Authorization": f"Bearer {token}"
              }
          )

          print("================================")
          print("   PINTEREST BOARD TEST")
          print("================================")
          print("Status:", response.status_code)
          print()

          try:
              data = response.json()
              print(data)
          except Exception:
              print(response.text)

          if response.status_code != 200:
              raise SystemExit("Pinterest API Fehler")