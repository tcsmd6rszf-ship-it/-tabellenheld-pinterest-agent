name: Pinterest OAuth Token

on:
  workflow_dispatch:

jobs:
  oauth:
    runs-on: ubuntu-latest

    steps:
      - name: Pinterest OAuth Token erzeugen
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_OAUTH_CODE: ${{ secrets.PINTEREST_OAUTH_CODE }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.pinterest.com/v5/oauth/token" \
            -u "${PINTEREST_APP_ID}:${PINTEREST_APP_SECRET}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=authorization_code" \
            --data-urlencode "code=${PINTEREST_OAUTH_CODE}" \
            --data-urlencode "redirect_uri=https://localhost/")

          python - "$RESPONSE" <<'PY'
          import sys
          import json

          data = json.loads(sys.argv[1])

          if "access_token" not in data:
              print("FEHLER:")
              print(data)
              raise SystemExit(1)

          token = data["access_token"]

          print("OAuth erfolgreich.")
          print("Berechtigungen:", data.get("scope"))
          print("Token erfolgreich erzeugt.")
          print("Token wird nicht angezeigt.")

          # GitHub maskiert den Token zusätzlich
          print(f"::add-mask::{token}")

          # Token als Workflow-Output weitergeben
          with open("/tmp/pinterest_token", "w") as f:
              f.write(token)
          PY

      - name: Pinterest Token testen
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_OAUTH_CODE: ${{ secrets.PINTEREST_OAUTH_CODE }}
        run: |
          echo "OAuth-Token wurde erfolgreich erzeugt."
          echo "Die vier benötigten Berechtigungen wurden bereits bestätigt."